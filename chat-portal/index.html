<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121"><meta name="description" content="SGGVISION AI — Marathi, Hindi and English AI assistant">
<title>SGGVISION AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#171717;--panel2:#2b2b2b;--line:#3b3b3b;--text:#ececec;--muted:#a5a5a5;--accent:#10a37f;--user:#303030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
.app{height:100dvh;display:grid;grid-template-columns:270px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:.2px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#10a37f,#08765d);display:grid;place-items:center;font-weight:800;color:white}.new{border:1px solid #555;background:transparent;color:var(--text);padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer}.new:hover,.thread:hover{background:var(--panel2)}.side-label{font-size:12px;color:var(--muted);padding:4px 5px}.threads{overflow:auto;display:flex;flex-direction:column;gap:4px}.thread{border:0;background:transparent;color:#ddd;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread.active{background:#343434}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px 4px}.main{min-width:0;display:flex;flex-direction:column;position:relative}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.model{font-weight:650}.lang{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px}.chat{flex:1;overflow:auto;padding:28px 18px 18px}.welcome{max-width:760px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:32px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 28px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.suggestion{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;cursor:pointer}.suggestion:hover{border-color:#777}.messages{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:22px}.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:13px;align-items:start}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#3b3b3b;font-size:12px;font-weight:700}.msg.assistant .avatar{background:var(--accent);color:#fff}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 0}.msg.user .bubble{background:var(--user);padding:12px 15px;border-radius:16px;display:inline-block}.composer-wrap{padding:12px 18px 20px}.composer{max-width:800px;margin:auto;border:1px solid #555;background:var(--panel2);border-radius:18px;padding:10px 12px;display:flex;align-items:flex-end;gap:9px}.composer textarea{flex:1;resize:none;max-height:180px;min-height:28px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:5px 2px}.send{width:36px;height:36px;border:0;border-radius:11px;background:var(--accent);color:white;font-size:19px;cursor:pointer}.send:disabled{opacity:.4;cursor:not-allowed}.hint{text-align:center;color:var(--muted);font-size:11px;margin:8px auto 0}.mobile-menu{display:none}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.top{padding:0 14px}.mobile-menu{display:block;border:0;background:transparent;color:var(--text);font-size:20px}.chat{padding:20px 14px}.welcome{margin:10vh auto 0}.welcome h1{font-size:26px}.suggestions{grid-template-columns:1fr}.composer-wrap{padding:10px 10px 14px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">S</div><span>SGGVISION AI</span></div><button class="new" id="newChat">＋ नवीन चॅट</button><div class="side-label">मागील संभाषणे</div><div class="threads" id="threads"></div><div class="side-foot">SGGVISION AI · मराठी • हिंदी • English</div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="mobileNew" aria-label="नवीन चॅट">＋</button><span class="model">SGGVISION AI</span></div><select class="lang" id="language" aria-label="भाषा"><option value="auto">Auto भाषा</option><option value="mr">मराठी</option><option value="hi">हिंदी</option><option value="en">English</option></select></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><h1>आज मी तुम्हाला कशी मदत करू?</h1><p>तुमचा प्रश्न मराठी, हिंदी किंवा इंग्रजीत विचारा.</p><div class="suggestions"><button class="suggestion">माझ्या YouTube व्हिडिओसाठी मराठी स्क्रिप्ट लिहा</button><button class="suggestion">या विषयासाठी आकर्षक थंबनेल कल्पना द्या</button><button class="suggestion">एखादा विषय सोप्या भाषेत समजावून सांगा</button><button class="suggestion">माझ्या व्यवसायासाठी योजना तयार करा</button></div></div><div class="messages" id="messages"></div></section>
<div class="composer-wrap"><div style="max-width:800px;margin:0 auto 8px;display:flex;justify-content:flex-end"><select class="lang" id="taskMode" aria-label="कामाचा प्रकार"><option value="general">सामान्य AI मदत</option><option value="script">YouTube स्क्रिप्ट</option><option value="seo">YouTube टायटल, डिस्क्रिप्शन व SEO</option><option value="thumbnail">थंबनेल मजकूर व डिझाइन सूचना</option><option value="translate">भाषांतर व मराठी शुद्धलेखन</option><option value="writing">अर्ज, पत्र व व्यावसायिक लेखन</option></select></div><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="SGGVISION AI ला काहीही विचारा..." aria-label="तुमचा संदेश"></textarea><button class="send" id="send" type="submit" aria-label="पाठवा">↑</button></form><div class="hint">AI कडून चुकीची माहिती मिळू शकते. महत्त्वाची माहिती तपासून घ्या.</div></div></main></div>
<script>
(()=>{const $=id=>document.getElementById(id);let chats=[],current=null,busy=false;
try{chats=JSON.parse(localStorage.getItem('sggvision_chats')||'[]')}catch{chats=[]}
const save=()=>{try{localStorage.setItem('sggvision_chats',JSON.stringify(chats.slice(0,40)))}catch{}};
function fresh(){current={id:Date.now().toString(),title:'नवीन चॅट',messages:[]};chats.unshift(current);save();render()}
function render(){const list=$('threads');list.replaceChildren();chats.forEach(c=>{const b=document.createElement('button');b.className='thread'+(current&&c.id===current.id?' active':'');b.textContent=c.title;b.onclick=()=>{current=c;render()};list.append(b)});const box=$('messages');box.replaceChildren();$('welcome').style.display=current&&current.messages.length?'none':'block';if(!current)return;current.messages.forEach(m=>addMessage(m.role,m.content,false));$('chat').scrollTop=$('chat').scrollHeight}
function addMessage(role,content,scroll=true){const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'तुम्ही':'S';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=content;row.append(av,bubble);$('messages').append(row);if(scroll)$('chat').scrollTop=$('chat').scrollHeight;return bubble}
async function send(text){if(busy||!text.trim())return;if(!current)fresh();busy=true;$('send').disabled=true;$('prompt').value='';current.messages.push({role:'user',content:text});if(current.messages.length===1)current.title=text.slice(0,38);addMessage('user',text);const wait=addMessage('assistant','उत्तर तयार करत आहे…');save();try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:current.messages.slice(-16),language:$('language').value,mode:$('taskMode').value})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||'सर्व्हरकडून उत्तर मिळाले नाही.');const answer=String(data.response||'उत्तर रिकामे मिळाले.');wait.textContent=answer;current.messages.push({role:'assistant',content:answer});save()}catch(e){wait.textContent='कनेक्शनमध्ये अडचण: '+e.message+'\n\nCloudflare Pages वर /api/chat फंक्शन आणि AI binding उपलब्ध आहे का ते तपासा.'}finally{busy=false;$('send').disabled=false;$('prompt').focus();render()}}
$('form').addEventListener('submit',e=>{e.preventDefault();send($('prompt').value)});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});$('prompt').addEventListener('input',()=>{const t=$('prompt');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'});$('newChat').onclick=fresh;$('mobileNew').onclick=fresh;document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>send(b.textContent));if(chats.length){current=chats[0];render()}else fresh()})();
</script></body></html>
