name: Validate SGGVISION portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Pages functions syntax
        run: |
          node --input-type=module --check < functions/api/generate.js
          node --input-type=module --check < functions/api/thumbnail.js
      - name: Check portal feature wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const thumbnail = fs.readFileSync('functions/api/thumbnail.js', 'utf8');
          const generate = fs.readFileSync('functions/api/generate.js', 'utf8');
          const dictionaryMatch = html.match(/const sggTranslations=(\{[\s\S]*?\n\};)/);
          if (!dictionaryMatch) throw new Error('The local English translation dictionary is missing.');
          const translations = vm.runInNewContext('(' + dictionaryMatch[1].slice(0, -1) + ')');
          const pageBody = html.split('<body>')[1]?.split('</body>')[0] || '';
          const visibleText = [...pageBody.matchAll(/>([^<>]+)</g)]
            .map(match => match[1].replace(/\s+/g, ' ').trim())
            .filter(value => /[\u0900-\u097F]/.test(value) && value.length > 3);
          const untranslated = [...new Set(visibleText)].filter(value =>
            !translations[value] && !Object.keys(translations).some(key => key.length > 8 && value.includes(key))
          );
          if (untranslated.length) throw new Error('Visible Marathi text lacks English translations: ' + untranslated.join(' | '));
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML ids: ' + [...new Set(duplicates)].join(', '));
          const missingIds = [...new Set([...html.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)].map(match => match[1]))]
            .filter(id => !ids.includes(id));
          if (missingIds.length) throw new Error('JavaScript references missing HTML ids: ' + missingIds.join(', '));
          const required = [
            ['SEO result copy/PDF', 'seoResult'],
            ['Script result copy/PDF', 'scriptResult'],
            ['Thumbnail text copy/PDF', 'thumbResult'],
            ['Reels result copy/PDF', 'reelResult'],
            ['Social post copy/PDF', 'postResult'],
            ['Letter result copy/PDF', 'letterResult'],
          ];
          for (const [label, id] of required) {
            if (!html.includes("copyAIResult('" + id + "')") || !html.includes("saveAIResultPDF('" + id + "')")) {
              throw new Error('Missing copy/PDF controls for ' + label);
            }
          }
          if (!html.includes("fetch('/api/generate'") || !html.includes("fetch('/api/thumbnail'")) {
            throw new Error('A required AI API endpoint is not connected to the website.');
          }
          const scriptGenerator = html.slice(html.indexOf('function scriptDemo()'), html.indexOf('\nfunction extraAI', html.indexOf('function scriptDemo()')));
          if (!scriptGenerator.includes("document.querySelector('button[onclick=\"scriptDemo()\"]')") ||
              !scriptGenerator.includes("callAI(prompt,'scriptResult',btn,['scriptTopic','duration'])") ||
              !html.includes('async function callAI(prompt,target,button,lockIds=[])') ||
              !html.includes("lockedControls.forEach(control=>{control.disabled=true") ||
              !html.includes("lockedControls.forEach(control=>{control.disabled=false")) {
            throw new Error('Script generation must bind its own button and lock/restore topic and duration controls.');
          }
          if (!html.includes('function tmValidateImageDimensions(img)') ||
              !html.includes('width*height>40000000') ||
              !html.includes('tmValidateImageDimensions(img);')) {
            throw new Error('Thumbnail image dimension safeguards are missing.');
          }
          if (!html.includes("dataUrl.startsWith('data:image/png')") ||
              !html.includes('डाउनलोड त्रुटी:')) {
            throw new Error('Thumbnail PNG download error handling is missing.');
          }
          if (!html.includes("let tmLastRatio = '16:9'") ||
              !html.includes("ratio=ratioField.value") ||
              !html.includes("tmCompose(img,headline,sub,brief.category,brief.supportingPoints,brief.closingLine,'',ratio)") ||
              !html.includes("const canvas=document.getElementById('tmCanvas'),ratio=tmLastRatio") ||
              !html.includes("field.disabled=true") || !html.includes("field.disabled=false")) {
            throw new Error('Thumbnail generation must lock the selected settings and preserve the output ratio through download.');
          }
          if (!thumbnail.includes('"birthday"') || !html.includes("category==='birthday'")) {
            throw new Error('Birthday thumbnail category is not supported end-to-end.');
          }
          if (!thumbnail.includes('const parsedPlan = parsePlannerOutput(plannerText)') || !thumbnail.includes('typeof plan[key] !== "string"') || !thumbnail.includes('filter(point => typeof point === "string")')) {
            throw new Error('Thumbnail planner output type validation is missing.');
          }
          if (!thumbnail.includes('async function readImageBlobLimited') || !thumbnail.includes('total > maxBytes') || !thumbnail.includes('await readImageBlobLimited(imageResponse)')) {
            throw new Error('Reference image streaming size limit is missing.');
          }
          if (!generate.includes('isEnglishRequest') || !generate.includes('Write the entire response in English only')) {
            throw new Error('English response handling is missing from the text AI endpoint.');
          }
          if (!generate.includes('main content') || !generate.includes('conclusion') || !generate.includes('hasScriptBody')) {
            throw new Error('English and Marathi script section validation is missing.');
          }
          if (!generate.includes('isEnglishRequest') || !generate.includes('main content') || !generate.includes('मुख्य माहिती') || !generate.includes('const hasScriptBody')) {
            throw new Error('Script quality validation must require complete language-specific section headings.');
          }
          if (!generate.includes('const leaksMarkup =') ||
              !generate.includes('!leaksMarkup') ||
              !generate.includes('&(?:#\\d+|#x[0-9a-f]+|[a-z][a-z0-9]+);')) {
            throw new Error('Generated scripts must reject leaked HTML tags and entities.');
          }
          for (const section of ['title', 'introduction', 'main content', 'conclusion', 'प्रस्तावना', 'मुख्य माहिती', 'निष्कर्ष']) {
            if (!generate.includes(section)) throw new Error('Script validation is missing required section: ' + section);
          }
          if (html.includes('AI Tools — ChatGPT Assistance')) {
            throw new Error('The portal must not mislabel Cloudflare Workers AI as ChatGPT.');
          }
          if (!html.includes('AI Tools — Smart AI Assistance')) {
            throw new Error('The English AI tools heading is missing or inaccurate.');
          }
          if (!html.includes('function sggWatchGoogleTranslate()') || !html.includes('new MutationObserver(')) {
            throw new Error('Asynchronous full-page language switching is missing its load observer.');
          }
          if (!html.includes("signal:AbortSignal.timeout(120000)") || !html.includes("signal:AbortSignal.timeout(180000)") || !html.includes("TimeoutError")) {
            throw new Error('AI frontend request timeouts and readable timeout messages are missing.');
          }
          const validatorMatch = generate.match(/const inspectScript = \(value\) => \{[\s\S]*?\n    \};/);
          if (!validatorMatch) throw new Error('Could not extract the script quality validator for behavior tests.');
          const makeValidator = (isEnglishRequest, minutes) => vm.runInNewContext(
            '(' + validatorMatch[0].replace('const inspectScript = ', '').replace(/;$/, '') + ')',
            { isEnglishRequest, minutes }
          );
          const marathiValidator = makeValidator(false, 5);
          const marathiLines = [
            'शीर्षक',
            'प्रस्तावना',
            ...Array.from({length: 42}, (_, index) =>
              'या विषयाचा महत्त्वाचा पैलू क्रमांक ' + (index + 1) + ' समाजाच्या अनुभवाशी आणि दैनंदिन जीवनाशी जवळून संबंधित आहे'
            ),
            'मुख्य माहिती',
            'निष्कर्ष'
          ];
          const validMarathiScript = marathiLines.join('. ') + '.';
          if (!marathiValidator(validMarathiScript).valid) {
            throw new Error('A complete, sufficiently long Marathi script should pass quality validation.');
          }
          if (marathiValidator(validMarathiScript + ' &eacute;').valid) {
            throw new Error('Named HTML entities must fail Marathi script quality validation.');
          }
          if (marathiValidator(validMarathiScript + ' <div>अयोग्य मजकूर</div>').valid) {
            throw new Error('HTML tags must fail Marathi script quality validation.');
          }
          const repeatedLine = 'या विषयाचा महत्त्वाचा पैलू समाजाच्या अनुभवाशी आणि दैनंदिन जीवनाशी जवळून संबंधित आहे';
          if (marathiValidator(validMarathiScript + '. ' + Array(9).fill(repeatedLine).join('. ')).valid) {
            throw new Error('Excessive repeated sentences must fail Marathi script quality validation.');
          }
          const englishValidator = makeValidator(true, 5);
          const englishScript = [
            'Title', 'Introduction',
            ...Array.from({length: 42}, (_, index) =>
              'This important aspect number ' + (index + 1) + ' connects the subject with everyday experiences and practical understanding'
            ),
            'Main Content', 'Conclusion'
          ].join('. ') + '.';
          if (!englishValidator(englishScript).valid) {
            throw new Error('A complete English script should pass quality validation.');
          }
          console.log('Script quality behavior tests passed for Marathi and English, markup leakage, and repetition.');
          console.log('Verified six result copy/PDF controls, both AI endpoints, bilingual text generation, and birthday thumbnail routing.');
          NODE
      - name: Smoke test API validation and safe error paths
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { onRequestPost as generate } from './functions/api/generate.js';
          import { onRequestPost as thumbnail } from './functions/api/thumbnail.js';

          const makeRequest = (url, method = 'POST', body = {}, extraHeaders = {}) =>
            new Request(url, {
              method,
              headers: { 'Content-Type': 'application/json', Host: 'portal.test', ...extraHeaders },
              body: method === 'GET' ? undefined : JSON.stringify(body)
            });

          for (const [name, handler] of [['generate', generate], ['thumbnail', thumbnail]]) {
            let response = await handler({ request: makeRequest('https://portal.test/api/' + name, 'GET'), env: {} });
            assert.equal(response.status, 405, name + ' must reject non-POST requests');

            response = await handler({ request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: '' }), env: {} });
            assert.equal(response.status, 400, name + ' must reject empty prompts');

            response = await handler({ request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: { text: 'not a string' } }), env: {} });
            assert.equal(response.status, 400, name + ' must reject non-string prompts');

            response = await handler({
              request: new Request('https://portal.test/api/' + name, {
                method: 'POST', headers: { 'Content-Type': 'application/json', Host: 'portal.test' }, body: '{invalid json'
              }),
              env: {}
            });
            assert.equal(response.status, 400, name + ' must reject malformed JSON safely');

            const oversizedBody = JSON.stringify({
              prompt: 'valid prompt',
              extra: 'x'.repeat(name === 'generate' ? 513 * 1024 : 257 * 1024)
            });
            response = await handler({
              request: new Request('https://portal.test/api/' + name, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Host: 'portal.test' },
                body: oversizedBody
              }),
              env: {}
            });
            assert.equal(response.status, 413, name + ' must reject oversized streamed bodies without relying on Content-Length');

            response = await handler({
              request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: 'test' }, { 'Content-Type': 'text/plain' }),
              env: {}
            });
            assert.equal(response.status, 415, name + ' must reject non-JSON content types');

            response = await handler({
              request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: 'test' }, { 'Content-Type': 'application/jsonp' }),
              env: {}
            });
            assert.equal(response.status, 415, name + ' must reject misleading JSON-like content types');

            response = await handler({
              request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: 'test' }, { Origin: 'https://attacker.test' }),
              env: {}
            });
            assert.equal(response.status, 403, name + ' must reject cross-origin requests');

            response = await handler({
              request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: 'test' }, { Origin: 'not-a-valid-origin' }),
              env: {}
            });
            assert.equal(response.status, 403, name + ' must reject malformed origin headers');

            response = await handler({ request: makeRequest('https://portal.test/api/' + name, 'POST', { prompt: 'valid test prompt' }), env: {} });
            assert.equal(response.status, 503, name + ' must report a missing AI binding clearly');
          }
          console.log('API validation smoke tests passed for both endpoints.');
          const thumbnailSource = fs.readFileSync('functions/api/thumbnail.js', 'utf8');
          const frontendSource = fs.readFileSync('index.html', 'utf8');
          if (!thumbnailSource.includes('image.length > 10 * 1024 * 1024') ||
              !thumbnailSource.includes('A-Za-z0-9+/')) {
            throw new Error('Thumbnail API must bound and validate generated base64 image payloads');
          }
          if (!frontendSource.includes('data.image.length>10*1024*1024') ||
              !frontendSource.includes('A-Za-z0-9+/')) {
            throw new Error('Thumbnail frontend must validate generated image payloads before decoding');
          }

          NODE
      - name: Check website inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript blocks found');
          scripts.forEach((source, index) => new vm.Script(source, { filename: 'index-inline-' + (index + 1) + '.js' }));
          console.log('Validated ' + scripts.length + ' inline JavaScript blocks.');
          NODE
